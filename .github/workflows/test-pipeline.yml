name: PR Test Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install flake8
        run: python -m pip install --upgrade pip && pip install flake8
      - name: Run flake8
        run: flake8 src || true

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        run: pytest -q --junitxml=reports/junit/unit-junit.xml
      - name: Upload unit junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-junit
          path: reports/junit/unit-junit.xml

  security-scans:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install pip-audit
        run: python -m pip install --upgrade pip && pip install pip-audit
      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt --format json -o reports/security/pip_audit.json || true
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/security

  model-validation:
    runs-on: ubuntu-latest
    needs: security-scans
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run model validation
        run: |
          export MLFLOW_TRACKING_URI="file:./mlruns"
          python tests/validate_model.py --min-accuracy 0.7 --run-id-file reports/validated_run.txt
      - name: Upload model validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-validation
          path: reports

  esg-check:
    runs-on: ubuntu-latest
    needs: model-validation
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps (codecarbon)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt codecarbon
      - name: Run ESG budget check
        run: |
          python tests/esg_budget_check.py --max-kg 0.5 --out reports/esg_report.json
      - name: Upload esg report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esg-report
          path: reports/esg_report.json

  integration:
    runs-on: ubuntu-latest
    needs: esg-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest requests uvicorn

      - name: Train model (produce artifacts/model.joblib)
        run: |
          export MLFLOW_TRACKING_URI="file:./mlruns"
          python src/train.py

      - name: Start Uvicorn server (background) and wait for readiness
        run: |
          nohup uvicorn src.serve:app --host 0.0.0.0 --port 8080 &> /tmp/uvicorn.log &
          i=0
          until curl -sSf http://localhost:8080/ || [ $i -ge 30 ]; do
            i=$((i+1))
            echo "waiting for server... $i"
            sleep 1
          done
          echo "--- server log tail ---"
          tail -n 50 /tmp/uvicorn.log || true

      - name: Run API integration tests
        run: pytest tests/test_api_integration.py -q

  build-and-push:
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/esg-app:latest
