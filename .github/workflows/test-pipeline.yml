name: PR Test Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest -q

  model-validation:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Run model validation
        run: |
          pip install -r requirements.txt
          python tests/validate_model.py --min-accuracy 0.7

  esg-check:
    runs-on: ubuntu-latest
    needs: model-validation
    steps:
      - uses: actions/checkout@v4
      - name: Run ESG check
        run: |
          pip install -r requirements.txt codecarbon
          python tests/esg_budget_check.py --max-kg 0.5 --out reports/esg_report.json

  integration:
  runs-on: ubuntu-latest
  needs: esg-check
  steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest requests

    - name: Train model (produce artifacts/model.joblib)
      run: |
        # Use file-based mlruns so MLflow doesn't need a server
        export MLFLOW_TRACKING_URI="file:./mlruns"
        python src/train.py

    - name: Start Uvicorn server (background) and wait for readiness
      run: |
        nohup uvicorn src.serve:app --host 0.0.0.0 --port 8080 &> /tmp/uvicorn.log &
        # wait up to 30s for health
        i=0
        until curl -sSf http://localhost:8080/ || [ $i -ge 30 ]; do
          i=$((i+1))
          echo "waiting for server... $i"
          sleep 1
        done
        echo "------ server log (tail) ------"
        tail -n +1 /tmp/uvicorn.log || true

    - name: Run API integration tests
      run: |
        pytest tests/test_api_integration.py -q

    - name: Upload integration junit
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-junit
        path: reports/junit/integration-junit.xml
