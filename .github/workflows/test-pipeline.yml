name: PR Test Pipeline

# Run on any push or PR while we're debugging
on:
  push: {}
  pull_request: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install flake8
        run: python -m pip install --upgrade pip && pip install flake8
      - name: Run flake8
        run: flake8 src || true

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest
        run: pytest -q --junitxml=reports/junit/unit-junit.xml
      - name: Upload unit junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-junit
          path: reports/junit/unit-junit.xml

  model-validation:
    name: Model validation
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run model validation
        run: |
          export MLFLOW_TRACKING_URI="file:./mlruns"
          python tests/validate_model.py --min-accuracy 0.7 --run-id-file reports/validated_run.txt
      - name: Upload model validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-validation
          path: reports

  esg-check:
    name: ESG check
    runs-on: ubuntu-latest
    needs: model-validation
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps (codecarbon)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt codecarbon
      - name: Run ESG budget check
        run: |
          python tests/esg_budget_check.py --max-kg 0.5 --out reports/esg_report.json
      - name: Upload esg report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esg-report
          path: reports/esg_report.json

  integration:
    name: Integration (train -> start server -> tests)
    runs-on: ubuntu-latest
    needs: esg-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies (debug)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest requests uvicorn joblib scikit-learn numpy || true

      - name: Show repo & check model artifact
        run: |
          echo "PWD: $(pwd)"
          echo "ls -la repo root:"
          ls -la
          echo "ls -la artifacts:"
          ls -la artifacts || true
          echo "check model file exists:"
          if [ -f artifacts/model.joblib ]; then echo "MODEL EXISTS"; else echo "MODEL MISSING"; fi

      - name: Quick python sanity checks (imports + load model)
        run: |
          echo "python version:"
          python -V
          echo "numpy version:"
          python -c "import numpy as np; print(np.__version__)"
          echo "sklearn version:"
          python -c "import sklearn; print(sklearn.__version__)"
          echo "joblib import test:"
          python -c "import joblib; print('joblib ok')"
          echo "try loading model (this will show error if load fails):"
          python -c "import joblib, sys, os; p='artifacts/model.joblib'; print('exists?', os.path.exists(p)); sys.stdout.flush(); \
            try: m=joblib.load(p); print('loaded ok, type=', type(m)); \
            except Exception as e: print('MODEL LOAD ERROR:', repr(e)); raise"

      - name: Start Uvicorn server (background) and wait for /health
        run: |
          nohup uvicorn src.serve:app --host 0.0.0.0 --port 8080 --log-level info &> /tmp/uvicorn.log &
          sleep 1
          echo "=== server processes (ps) ==="
          ps aux | grep uvicorn || true
          echo "=== listening ports (ss) ==="
          ss -tulpn || true
          i=0
          until curl -sSf -o /dev/null http://localhost:8080/health || [ $i -ge 30 ]; do
            i=$((i+1))
            echo "waiting for /health... $i"
            sleep 1
          done
          echo "------ server log (tail 200) ------"
          tail -n 200 /tmp/uvicorn.log || true

      - name: Run API integration tests
        run: |
          pytest tests/test_api_integration.py -q

